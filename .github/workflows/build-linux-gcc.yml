---
name: Build for Linux with GCC
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - benchmark/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/build-linux-gcc.yml
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - src/**
      - test/**
      - benchmark/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/build-linux-gcc.yml

jobs:
  linux-gcc:
    runs-on: ubuntu-latest
    env:
      CMAKE_GENERATOR: "Ninja Multi-Config"
      CTEST_OUTPUT_ON_FAILURE: 1
      PTRIE_TAG: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install cmake ninja-build g++ libsparsehash-dev clang-format-20 clang-tidy-20
      - name: Setup Runner Environment
        run: |
          uname -a
          lsb_release -a
          CORES=$(nproc)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v5
      - name: Code Formatting
        run: find . -iregex '.*\.\(c\|h\|cpp\|hpp\|cc\|hh\|cxx\|hxx\)$' | xargs clang-format-20 -n -Werror
      - name: Configure Multi-Config with Sanitizers
        run: cmake --preset multi-san -DBENCHMARK_PLOTS=OFF
      - name: Build Debug with Sanitizers
        run: cmake --build --preset debug-san
      - name: Test Debug with Sanitizers
        run: ctest --preset debug-san
      - name: Tidy
        run: run-clang-tidy-20 -p build-multi-san -header-filter="$PWD/(include|src|test|benchmark)/.*" -source-filter="$PWD/(src|test|benchmark)/.*"
#      - name: Build Release with Sanitizers
#        run: cmake --build --preset release-san
#      - name: Test Release with Sanitizers
#        run: ctest --preset release-san
      - name: Quick Debug with Sanitizers
        run: cmake --workflow --preset quick-san-debug
      - name: Quick Debug Install to local with Sanitizers
        run: cmake --install build-quick-san --config Debug --prefix "$PWD/local"
      - name: Configure Example with local and Sanitizers
        run: cmake -S example -B build-example-local -DCMAKE_PREFIX_PATH="$PWD/local" -DCMAKE_CXX_FLAGS=-fsanitize=undefined,address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined,address
      - name: Build Example with local and Sanitizers
        run: cmake --build build-example-local --config Debug
      - name: Test Example with local and Sanitizers
        run: ctest --test-dir build-example-local -C Debug --verbose
      - name: Configure Example with Sanitizers
        run: cmake -S example -B build-example -DPTRIE_TAG=${PTRIE_TAG} -DCMAKE_CXX_FLAGS=-fsanitize=undefined,address -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined,address
      - name: Build Example with Sanitizers
        run: cmake --build build-example --config Debug
      - name: Test Example with Sanitizers
        run: ctest --test-dir build-example -C Debug --verbose
