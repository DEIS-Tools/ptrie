---
name: Build for Windows-MSYS2-UCRT64
on:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - benchmark/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/build-win-msys2-ucrt64.yml
  pull_request:
    branches: [main]
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - src/**
      - test/**
      - benchmark/**
      - cmake/**
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/build-win-msys2-ucrt64.yml
  workflow_dispatch:

jobs:
  windows-msys2-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CMAKE_GENERATOR: "Ninja Multi-Config"
      CTEST_OUTPUT_ON_FAILURE: 1
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git cmake ninja mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python-matplotlib mingw-w64-ucrt-x86_64-python-pandas mingw-w64-ucrt-x86_64-python-scipy
      - name: Setup Runner Environment
        run: |
          uname -a
          CORES=$(nproc)
          echo "CMAKE_BUILD_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_PARALLEL_LEVEL=$CORES" >> $GITHUB_ENV
          echo "CTEST_TEST_LOAD=$CORES" >> $GITHUB_ENV
      - uses: actions/checkout@v5
      - name: Configure Multi-Config with Sanitizers
        run: cmake --preset multi-san
      - name: Build Debug with Sanitizers
        run: cmake --build --preset debug-san
      - name: Test Debug with Sanitizers
        run: ctest --preset debug-san
      - name: Build Release with Sanitizers
        run: cmake --build --preset release-san
      - name: Test Release with Sanitizers
        run: ctest --preset release-san
      - name: Quick Release
        run: cmake --workflow --preset quick-release
      - name: Quick Release Install to local
        run: cmake --install build-quick --config Release --prefix "$PWD/local"
      - name: Configure Example with local
        run: cmake -S example -B build-example-local -DCMAKE_PREFIX_PATH="$PWD/local"
      - name: Build Example with local
        run: cmake --build build-example-local
      - name: Test Example with local
        run: ctest --test-dir buld-example-local --verbose
      - name: Configure Example
        run: cmake -S example -B build-example
      - name: Build Example
        run: cmake --build build-example
      - name: Test Example
        run: ctest --test-dir buld-example --verbose
