---
name: Build for Linux with Clang
on:
  workflow_dispatch:
#  push:
#    branches: [main]
#    paths:
#      - src/**
#      - test/**
#      - benchmark/**
#      - cmake/**
#      - CMakeLists.txt
#      - CMakePresets.json
#      - .github/workflows/build-linux-clang.yml
#  pull_request:
#    branches: [main]
#    types: [synchronize, opened, reopened, ready_for_review]
#    paths:
#      - src/**
